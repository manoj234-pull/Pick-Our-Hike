[project]
name = "pick-our-hike"
version = "0.1.0"
description = "Local AI agent for a simulated shared hiking outing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langchain-ollama>=1,<2",
  "pydantic>=2.10,<3",
  "streamlit>=1.50,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pick_our_hike"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

